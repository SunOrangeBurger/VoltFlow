[build-system]
requires = ["maturin>=1.7.0,<2.0.0"]
build-backend = "maturin"

[project]
name = "voltflow"
version = "0.1.0"
description = "VoltFlow: Autonomous BESS Arbitrage & Degradation Management System"
requires-python = ">=3.10,<3.12"
dependencies = [
    "gymnasium==0.29.1",
    "stable-baselines3==2.3.2",
    "torch==2.4.0",
    "numpy>=1.26.4,<2.0.0",
    "pandas==2.2.2",
    "fastapi==0.112.0",
    "uvicorn[standard]==0.30.5",
    "websockets==12.0",
    "requests==2.32.3",
    "pydantic==2.8.2",
]

[tool.maturin]
manifest-path = "crates/voltflow_core/Cargo.toml"
python-source = "python"
module-name = "voltflow_core"
