[package]
name = "voltflow_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "voltflow_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22.2", features = ["extension-module"] }
numpy = "0.22.0"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"
csv = "1.3.0"
rand = "0.8.5"
rand_distr = "0.4.3"
rayon = "1.10.0"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"

[[bench]]
name = "sim_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# NOTE: panic="abort" intentionally omitted here (spec listed it, but it breaks
# `cargo test` and the criterion bench harness, which both require unwinding).
# The compiled PyO3 extension module still gets full opt-level/LTO/codegen-units
# benefits without it. See progress.md for rationale.
